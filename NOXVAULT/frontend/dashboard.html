<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NOXVAULT Network Security Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .box {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            min-height: 150px;
            overflow: auto;
            white-space: pre-wrap;
        }

        .charts {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        canvas {
            background: #1e293b;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<h1>NOXVAULT Network Security Dashboard</h1>

<!-- AUDIT BOXES -->
<div class="grid">
    <div class="box" id="systemAuditBox">Loading system health...</div>
    <div class="box" id="networkAuditBox">Loading threat events...</div>
    <div class="box" id="firewallAuditBox">Loading firewall stats...</div>
    <div class="box" id="securityAuditBox">Loading threat summary...</div>
    <div class="box" id="trafficAuditBox">Loading asset distribution...</div>
    <div class="box" id="vulnerabilityAuditBox">Loading vulnerabilities...</div>
</div>

<!-- CHARTS -->
<div class="charts">
    <canvas id="iocBarChart"></canvas>
    <canvas id="alertLineChart"></canvas>
    <canvas id="severityDonutChart"></canvas>
</div>

<!-- ⭐ FULL WEBSOCKET + CHART LOGIC -->
<script>
    const socket = new WebSocket("ws://127.0.0.1:8001/ws/noxvault-console");

    socket.onopen = () => {
        console.log("Connected to NOXVAULT WebSocket");
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        console.log("Received payload:", data);

        document.getElementById("systemAuditBox").textContent =
            JSON.stringify(data.system_health, null, 2);

        document.getElementById("networkAuditBox").textContent =
            JSON.stringify(data.threat_events, null, 2);

        document.getElementById("firewallAuditBox").textContent =
            JSON.stringify(data.firewall_stats, null, 2);

        document.getElementById("securityAuditBox").textContent =
            JSON.stringify(data.threat_summary, null, 2);

        document.getElementById("trafficAuditBox").textContent =
            JSON.stringify(data.asset_os_distribution, null, 2);

        document.getElementById("vulnerabilityAuditBox").textContent =
            JSON.stringify(data.vuln_counts, null, 2);

        updateCharts(data);
    };

    socket.onclose = () => {
        console.log("WebSocket connection closed");
    };

    socket.onerror = (error) => {
        console.error("WebSocket error:", error);
    };

    let iocChart, alertChart, severityChart;

    function updateCharts(data) {

        // IOC BAR CHART
        if (!iocChart) {
            iocChart = new Chart(document.getElementById("iocBarChart"), {
                type: "bar",
                data: {
                    labels: Object.keys(data.asset_os_distribution),
                    datasets: [{
                        label: "Assets",
                        data: Object.values(data.asset_os_distribution),
                        backgroundColor: [
                            "rgba(59, 130, 246, 0.8)",
                            "rgba(234, 179, 8, 0.8)",
                            "rgba(239, 68, 68, 0.8)"
                        ],
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        } else {
            iocChart.data.datasets[0].data = Object.values(data.asset_os_distribution);
            iocChart.update();
        }

        // ALERT LINE CHART
        if (!alertChart) {
            alertChart = new Chart(document.getElementById("alertLineChart"), {
                type: "line",
                data: {
                    labels: data.threat_events.map(e => e.ts),
                    datasets: [{
                        label: "Alerts",
                        data: data.threat_events.map(e => e.severity.length),
                        borderColor: "rgba(59, 130, 246, 1)",
                        backgroundColor: "rgba(59, 130, 246, 0.2)",
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: { plugins: { legend: { display: false } } }
            });
        } else {
            alertChart.data.labels = data.threat_events.map(e => e.ts);
            alertChart.data.datasets[0].data = data.threat_events.map(e => e.severity.length);
            alertChart.update();
        }

        // SEVERITY DONUT CHART
        if (!severityChart) {
            severityChart = new Chart(document.getElementById("severityDonutChart"), {
                type: "doughnut",
                data: {
                    labels: ["Critical", "High", "Medium", "Low"],
                    datasets: [{
                        data: [
                            data.threat_summary.critical,
                            data.threat_summary.high,
                            data.threat_summary.medium,
                            data.threat_summary.low
                        ],
                        backgroundColor: [
                            "rgba(239, 68, 68, 0.9)",
                            "rgba(249, 115, 22, 0.9)",
                            "rgba(234, 179, 8, 0.9)",
                            "rgba(34, 197, 94, 0.9)"
                        ]
                    }]
                },
                options: {
                    cutout: "60%",
                    plugins: {
                        legend: {
                            position: "bottom",
                            labels: { color: "#9ca3af", font: { size: 11 } }
                        }
                    }
                }
            });
        } else {
            severityChart.data.datasets[0].data = [
                data.threat_summary.critical,
                data.threat_summary.high,
                data.threat_summary.medium,
                data.threat_summary.low
            ];
            severityChart.update();
        }
    }
</script>

</body>
</html>
